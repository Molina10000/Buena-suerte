<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ramo de Flores Amarillas 3D</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --yellow-1: #fff7a8;
      --yellow-2: #ffd83d;
      --yellow-3: #f6b700;
      --yellow-4: #cc8200;
      --center-1: #8a4e14;
      --center-2: #3e210c;
      --leaf-1: #6fa33a;
      --leaf-2: #2f641f;
      --leaf-3: #173f18;
      --stem: #3e7028;
      --paper-1: #e8c996;
      --paper-2: #b98d58;
      --paper-3: #8b6039;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 244, 180, .75), transparent 24%),
        radial-gradient(circle at 50% 65%, rgba(255, 196, 0, .10), transparent 32%),
        linear-gradient(160deg, #fffaf0 0%, #f4ead8 50%, #dfcdb5 100%);
      perspective: 1200px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .32;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(84, 61, 36, .035) 0px,
          rgba(84, 61, 36, .035) 1px,
          transparent 1px,
          transparent 4px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, .12) 0px,
          rgba(255, 255, 255, .12) 1px,
          transparent 1px,
          transparent 5px
        );
      mix-blend-mode: multiply;
    }

    .scene {
      position: relative;
      width: min(92vw, 720px);
      height: min(94vh, 860px);
      transform-style: preserve-3d;
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotateX(2deg); }
      50% { transform: translateY(-10px) rotateX(4deg); }
    }

    .shadow {
      position: absolute;
      left: 50%;
      bottom: 2%;
      width: 55%;
      height: 8%;
      transform: translateX(-50%) rotateX(70deg);
      border-radius: 50%;
      background: rgba(65, 40, 15, .35);
      filter: blur(22px);
    }

    .bouquet {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .stem {
      position: absolute;
      left: 50%;
      bottom: 19%;
      width: 8px;
      height: 43%;
      border-radius: 999px;
      background:
        linear-gradient(90deg,
          #173814 0%,
          var(--stem) 28%,
          #6d9838 50%,
          #2a5b20 73%,
          #132f12 100%);
      box-shadow:
        inset 1px 0 rgba(255,255,255,.22),
        2px 4px 6px rgba(0,0,0,.16);
      transform-origin: bottom center;
    }

    .stem::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.05) 0 2px,
          transparent 2px 6px
        );
      opacity: .7;
    }

    .s1 { transform: translateX(-96px) rotate(-15deg); }
    .s2 { transform: translateX(-66px) rotate(-10deg); }
    .s3 { transform: translateX(-34px) rotate(-5deg); }
    .s4 { transform: translateX(-4px) rotate(0deg); }
    .s5 { transform: translateX(30px) rotate(6deg); }
    .s6 { transform: translateX(64px) rotate(11deg); }
    .s7 { transform: translateX(96px) rotate(16deg); }
    .s8 { transform: translateX(-128px) rotate(-21deg) scaleY(.92); }
    .s9 { transform: translateX(126px) rotate(21deg) scaleY(.92); }

    .leaf {
      position: absolute;
      width: 70px;
      height: 28px;
      border-radius: 100% 0 100% 0;
      background:
        radial-gradient(circle at 65% 35%, rgba(255,255,255,.22), transparent 24%),
        linear-gradient(145deg, var(--leaf-1), var(--leaf-2) 55%, var(--leaf-3));
      box-shadow:
        inset 0 1px rgba(255,255,255,.18),
        3px 5px 7px rgba(0,0,0,.15);
      transform-origin: 0 50%;
      overflow: hidden;
    }

    .leaf::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 50%;
      width: 90%;
      height: 1px;
      background: rgba(227, 255, 187, .35);
      transform: rotate(-18deg);
      transform-origin: left;
      box-shadow:
        14px -6px 0 -0.3px rgba(220,255,183,.16),
        29px -8px 0 -0.3px rgba(220,255,183,.14),
        14px 6px 0 -0.3px rgba(220,255,183,.13),
        30px 8px 0 -0.3px rgba(220,255,183,.12);
    }

    .l1 { left: 30%; bottom: 38%; transform: rotate(-155deg) rotateX(18deg); }
    .l2 { left: 44%; bottom: 42%; transform: rotate(-28deg) rotateY(24deg); }
    .l3 { left: 52%; bottom: 34%; transform: rotate(14deg) rotateY(-20deg); }
    .l4 { left: 37%; bottom: 29%; transform: rotate(-165deg) scale(.88); }
    .l5 { left: 52%; bottom: 48%; transform: rotate(20deg) scale(.82); }
    .l6 { left: 29%; bottom: 48%; transform: rotate(-145deg) scale(.76); }

    .flower {
      --size: 120px;
      position: absolute;
      width: var(--size);
      height: var(--size);
      transform-style: preserve-3d;
      filter: drop-shadow(0 12px 10px rgba(91, 58, 5, .18));
    }

    .flower .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 58%;
      border-radius: 50% 50% 45% 45%;
      transform-origin: 50% 88%;
      background:
        radial-gradient(circle at 34% 22%, rgba(255,255,255,.9), transparent 10%),
        radial-gradient(circle at 50% 58%, rgba(255, 245, 115, .68), transparent 44%),
        linear-gradient(145deg, var(--yellow-1), var(--yellow-2) 48%, var(--yellow-3) 74%, var(--yellow-4));
      box-shadow:
        inset 5px 8px 11px rgba(255,255,255,.28),
        inset -7px -10px 14px rgba(133,80,0,.18),
        0 4px 6px rgba(118,72,0,.12);
    }

    .flower .petal::after {
      content: "";
      position: absolute;
      inset: 8% 12%;
      border-radius: inherit;
      background:
        repeating-linear-gradient(
          80deg,
          rgba(255,255,255,.08) 0 1px,
          transparent 1px 5px
        );
      opacity: .9;
    }

    .p1 { transform: translate(-50%, -100%) rotate(0deg) rotateX(18deg); }
    .p2 { transform: translate(-50%, -100%) rotate(45deg) rotateX(18deg); }
    .p3 { transform: translate(-50%, -100%) rotate(90deg) rotateX(18deg); }
    .p4 { transform: translate(-50%, -100%) rotate(135deg) rotateX(18deg); }
    .p5 { transform: translate(-50%, -100%) rotate(180deg) rotateX(18deg); }
    .p6 { transform: translate(-50%, -100%) rotate(225deg) rotateX(18deg); }
    .p7 { transform: translate(-50%, -100%) rotate(270deg) rotateX(18deg); }
    .p8 { transform: translate(-50%, -100%) rotate(315deg) rotateX(18deg); }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34%;
      height: 34%;
      transform: translate(-50%, -50%) translateZ(15px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #f5b541 0 3%, transparent 4%),
        radial-gradient(circle at 65% 38%, #d68318 0 3%, transparent 4%),
        radial-gradient(circle at 38% 70%, #a95b11 0 3%, transparent 4%),
        radial-gradient(circle at 65% 68%, #6f390c 0 3%, transparent 4%),
        repeating-radial-gradient(circle at 48% 48%,
          #d79025 0 3px,
          #975112 3px 6px,
          #60310c 6px 9px);
      box-shadow:
        inset 3px 4px 6px rgba(255,213,105,.28),
        inset -5px -7px 8px rgba(45,21,3,.30),
        0 5px 8px rgba(63, 31, 2, .32);
    }

    .f1 { --size: 150px; left: 39%; top: 12%; transform: rotate(-5deg) translateZ(42px); z-index: 9; }
    .f2 { --size: 140px; left: 22%; top: 20%; transform: rotate(-12deg) translateZ(28px); z-index: 7; }
    .f3 { --size: 138px; right: 21%; top: 20%; transform: rotate(12deg) translateZ(30px); z-index: 8; }
    .f4 { --size: 132px; left: 12%; top: 31%; transform: rotate(-18deg) translateZ(10px); z-index: 5; }
    .f5 { --size: 145px; left: 39%; top: 30%; transform: rotate(4deg) translateZ(48px); z-index: 10; }
    .f6 { --size: 130px; right: 11%; top: 31%; transform: rotate(18deg) translateZ(12px); z-index: 5; }
    .f7 { --size: 120px; left: 25%; top: 40%; transform: rotate(-10deg) translateZ(20px); z-index: 6; }
    .f8 { --size: 122px; right: 25%; top: 41%; transform: rotate(9deg) translateZ(22px); z-index: 6; }
    .f9 { --size: 112px; left: 42%; top: 45%; transform: rotate(2deg) translateZ(32px); z-index: 7; }

    .wrap-back,
    .wrap-front {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      transform-origin: top center;
      clip-path: polygon(4% 0, 96% 0, 69% 100%, 31% 100%);
    }

    .wrap-back {
      bottom: 5%;
      width: 49%;
      height: 52%;
      z-index: 2;
      background:
        linear-gradient(135deg, rgba(255,255,255,.30), transparent 25%),
        repeating-linear-gradient(
          120deg,
          rgba(100,68,31,.06) 0 2px,
          transparent 2px 7px
        ),
        linear-gradient(145deg, var(--paper-1), var(--paper-2) 58%, var(--paper-3));
      box-shadow: 0 16px 28px rgba(77, 46, 17, .22);
      transform: translateX(-50%) rotateX(-2deg) translateZ(-8px);
    }

    .wrap-back::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        rgba(83,55,29,.18),
        transparent 28% 70%,
        rgba(83,55,29,.18));
      mix-blend-mode: multiply;
    }

    .wrap-front {
      bottom: 4%;
      width: 42%;
      height: 38%;
      z-index: 13;
      clip-path: polygon(14% 0, 86% 0, 67% 100%, 33% 100%);
      background:
        linear-gradient(150deg, rgba(255,255,255,.22), transparent 30%),
        repeating-linear-gradient(
          105deg,
          rgba(84,58,34,.055) 0 1px,
          transparent 1px 6px
        ),
        linear-gradient(155deg, #d5b177, #b68651 56%, #7b5231);
      box-shadow:
        inset 8px 0 14px rgba(255,255,255,.12),
        inset -10px 0 15px rgba(66,38,15,.15),
        0 13px 18px rgba(73,45,19,.16);
    }

    .ribbon {
      position: absolute;
      left: 50%;
      bottom: 17%;
      width: 115px;
      height: 34px;
      transform: translateX(-50%) translateZ(30px);
      z-index: 20;
      border-radius: 50%;
      background:
        linear-gradient(180deg, #8e5a2a, #513217);
      box-shadow:
        inset 0 4px 7px rgba(255,255,255,.10),
        0 5px 8px rgba(39,22,8,.24);
    }

    .ribbon::before,
    .ribbon::after {
      content: "";
      position: absolute;
      top: 18px;
      width: 62px;
      height: 88px;
      background: linear-gradient(145deg, #8d5b2d, #4b2d16);
      z-index: -1;
    }

    .ribbon::before {
      left: 9px;
      transform: rotate(24deg);
      clip-path: polygon(0 0, 100% 10%, 62% 100%, 48% 77%, 28% 100%);
    }

    .ribbon::after {
      right: 9px;
      transform: rotate(-24deg);
      clip-path: polygon(0 10%, 100% 0, 72% 100%, 49% 76%, 35% 100%);
    }

    .title {
      position: absolute;
      top: 2.2%;
      width: 100%;
      z-index: 50;
      text-align: center;
      color: #6f501f;
      letter-spacing: .05em;
      text-shadow: 0 2px 0 rgba(255,255,255,.7);
    }

    .title h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.55rem, 4vw, 2.4rem);
      font-weight: 700;
    }

    .title p {
      margin-top: .35rem;
      font-size: clamp(.78rem, 2vw, .95rem);
      opacity: .75;
    }

    @media (max-width: 620px) {
      .scene {
        transform: scale(.88);
      }

      .f1 { left: 36%; }
      .f5 { left: 36%; }
      .f9 { left: 39%; }
    }

    @media (max-height: 700px) {
      .scene {
        transform: scale(.78);
      }

      body {
        overflow: auto;
      }
    }
  </style>
</head>

<body>
  <main class="scene">
    <div class="title">
      <h1>Flores Amarillas</h1>
      <p>Un pequeño ramo hecho con HTML + CSS 🌻</p>
    </div>

    <div class="shadow"></div>

    <section class="bouquet">
      <div class="wrap-back"></div>

      <div class="stem s1"></div>
      <div class="stem s2"></div>

      <div class="stem s5"></div>

      <div class="leaf l1"></div>

      <div class="leaf l3"></div>
      <div class="leaf l4"></div>
      <div class="leaf l5"></div>
      <div class="leaf l6"></div>

      <!-- Flor 1 -->
      <div class="flower f1">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <!-- Flor 2 -->
      <div class="flower f2">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <!-- Flor 3 -->
      <div class="flower f3">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <!-- Flor 4 -->
      <div class="flower f4">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <!-- Flor 5 -->
      <div class="flower f5">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <!-- Flor 6 -->
      <div class="flower f6">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <!-- Flor 7 -->
      <div class="flower f7">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <!-- Flor 8 -->
      <div class="flower f8">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <!-- Flor 9 -->
      <div class="flower f9">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <div class="wrap-front"></div>
      <div class="ribbon"></div>
    </section>
  </main>
</body>
</html>
