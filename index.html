<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flores Amarillas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg1: #fffaf0;
      --bg2: #f7ead4;
      --bg3: #ead3b2;

      --yellow1: #fff8a8;
      --yellow2: #ffd93d;
      --yellow3: #f7b800;
      --yellow4: #c97d00;

      --brown1: #8b4f16;
      --brown2: #4a2608;

      --leaf1: #72a33d;
      --leaf2: #346c24;
      --leaf3: #173d18;

      --box1: #f6c94f;
      --box2: #d99921;
      --box3: #a96712;

      --ribbon1: #fff0a6;
      --ribbon2: #d8ae35;
      --ribbon3: #a77a13;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 24%, rgba(255,255,255,.92), transparent 28%),
        radial-gradient(circle at 50% 73%, rgba(255,194,0,.12), transparent 32%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      perspective: 1200px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .28;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(92,61,30,.025) 0 1px,
          transparent 1px 4px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,.12) 0 1px,
          transparent 1px 5px
        );
      mix-blend-mode: multiply;
    }

    .scene {
      position: relative;
      width: min(92vw, 720px);
      height: min(94vh, 860px);
      transform-style: preserve-3d;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .floor-shadow {
      position: absolute;
      left: 50%;
      bottom: 6%;
      width: 52%;
      height: 8%;
      transform: translateX(-50%) rotateX(72deg);
      border-radius: 50%;
      background: rgba(74, 43, 14, .28);
      filter: blur(22px);
      transition: all .9s ease;
    }

    .scene.open .floor-shadow {
      width: 60%;
      opacity: .8;
    }

    /* =========================
       RAMO
       ========================= */

    .bouquet {
      position: absolute;
      left: 50%;
      bottom: 22%;
      width: 430px;
      height: 490px;
      transform: translateX(-50%) translateY(220px) scale(.62);
      transform-origin: 50% 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 8;
      transition:
        transform 1.2s cubic-bezier(.18,.82,.22,1.1),
        opacity .55s ease .2s;
    }

    .scene.open .bouquet {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
    }

    .stem {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 7px;
      height: 280px;
      border-radius: 999px;
      transform-origin: bottom center;
      background:
        linear-gradient(
          90deg,
          #173a16 0%,
          #477a2d 30%,
          #78a445 48%,
          #346728 70%,
          #153416 100%
        );
      box-shadow:
        inset 1px 0 rgba(255,255,255,.2),
        2px 3px 5px rgba(0,0,0,.12);
    }

    .s1 { transform: translateX(-105px) rotate(-17deg); }
    .s2 { transform: translateX(-75px) rotate(-12deg); }
    .s3 { transform: translateX(-42px) rotate(-7deg); }
    .s4 { transform: translateX(-10px) rotate(-2deg); }
    .s5 { transform: translateX(22px) rotate(4deg); }
    .s6 { transform: translateX(55px) rotate(9deg); }
    .s7 { transform: translateX(88px) rotate(14deg); }
    .s8 { transform: translateX(-128px) rotate(-22deg) scaleY(.92); }
    .s9 { transform: translateX(120px) rotate(21deg) scaleY(.92); }

    .leaf {
      position: absolute;
      width: 72px;
      height: 29px;
      border-radius: 100% 0 100% 0;
      transform-origin: 0 50%;
      background:
        radial-gradient(circle at 66% 32%, rgba(255,255,255,.2), transparent 24%),
        linear-gradient(145deg, var(--leaf1), var(--leaf2) 55%, var(--leaf3));
      box-shadow:
        inset 0 1px rgba(255,255,255,.18),
        3px 5px 7px rgba(0,0,0,.13);
      overflow: hidden;
    }

    .leaf::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 50%;
      width: 88%;
      height: 1px;
      background: rgba(226,255,190,.35);
      transform: rotate(-18deg);
      transform-origin: left;
    }

    .l1 { left: 122px; bottom: 130px; transform: rotate(-154deg); }
    .l2 { left: 191px; bottom: 165px; transform: rotate(-28deg); }
    .l3 { left: 226px; bottom: 115px; transform: rotate(16deg); }
    .l4 { left: 158px; bottom: 82px; transform: rotate(-164deg) scale(.88); }
    .l5 { left: 228px; bottom: 198px; transform: rotate(19deg) scale(.84); }
    .l6 { left: 125px; bottom: 198px; transform: rotate(-146deg) scale(.78); }

    .flower {
      --size: 120px;
      position: absolute;
      width: var(--size);
      height: var(--size);
      transform-style: preserve-3d;
      filter: drop-shadow(0 11px 9px rgba(105,65,3,.17));
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 58%;
      border-radius: 50% 50% 44% 44%;
      transform-origin: 50% 88%;
      background:
        radial-gradient(circle at 33% 22%, rgba(255,255,255,.9), transparent 10%),
        radial-gradient(circle at 50% 58%, rgba(255,247,120,.6), transparent 43%),
        linear-gradient(
          145deg,
          var(--yellow1),
          var(--yellow2) 48%,
          var(--yellow3) 75%,
          var(--yellow4)
        );
      box-shadow:
        inset 5px 8px 11px rgba(255,255,255,.25),
        inset -7px -10px 14px rgba(131,78,0,.18),
        0 4px 6px rgba(118,72,0,.10);
    }

    .petal::after {
      content: "";
      position: absolute;
      inset: 9% 12%;
      border-radius: inherit;
      background:
        repeating-linear-gradient(
          80deg,
          rgba(255,255,255,.09) 0 1px,
          transparent 1px 5px
        );
      opacity: .85;
    }

    .p1 { transform: translate(-50%, -100%) rotate(0deg) rotateX(18deg); }
    .p2 { transform: translate(-50%, -100%) rotate(45deg) rotateX(18deg); }
    .p3 { transform: translate(-50%, -100%) rotate(90deg) rotateX(18deg); }
    .p4 { transform: translate(-50%, -100%) rotate(135deg) rotateX(18deg); }
    .p5 { transform: translate(-50%, -100%) rotate(180deg) rotateX(18deg); }
    .p6 { transform: translate(-50%, -100%) rotate(225deg) rotateX(18deg); }
    .p7 { transform: translate(-50%, -100%) rotate(270deg) rotateX(18deg); }
    .p8 { transform: translate(-50%, -100%) rotate(315deg) rotateX(18deg); }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34%;
      height: 34%;
      transform: translate(-50%, -50%) translateZ(15px);
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, #f3b342 0 3%, transparent 4%),
        radial-gradient(circle at 66% 38%, #d78118 0 3%, transparent 4%),
        radial-gradient(circle at 38% 70%, #a85a11 0 3%, transparent 4%),
        radial-gradient(circle at 65% 68%, #70380c 0 3%, transparent 4%),
        repeating-radial-gradient(
          circle at 48% 48%,
          #d99127 0 3px,
          #975112 3px 6px,
          #60310c 6px 9px
        );
      box-shadow:
        inset 3px 4px 6px rgba(255,213,105,.25),
        inset -5px -7px 8px rgba(45,21,3,.28),
        0 5px 8px rgba(63,31,2,.3);
    }

    .f1 { --size: 148px; left: 142px; top: 0; transform: rotate(-5deg) translateZ(42px); z-index: 9; }
    .f2 { --size: 136px; left: 55px; top: 72px; transform: rotate(-12deg) translateZ(28px); z-index: 7; }
    .f3 { --size: 136px; right: 48px; top: 72px; transform: rotate(12deg) translateZ(30px); z-index: 8; }
    .f4 { --size: 126px; left: 6px; top: 152px; transform: rotate(-18deg) translateZ(10px); z-index: 5; }
    .f5 { --size: 143px; left: 143px; top: 135px; transform: rotate(4deg) translateZ(48px); z-index: 10; }
    .f6 { --size: 126px; right: 0; top: 150px; transform: rotate(18deg) translateZ(12px); z-index: 5; }
    .f7 { --size: 118px; left: 80px; top: 205px; transform: rotate(-10deg) translateZ(20px); z-index: 6; }
    .f8 { --size: 118px; right: 76px; top: 208px; transform: rotate(9deg) translateZ(22px); z-index: 6; }
    .f9 { --size: 108px; left: 160px; top: 245px; transform: rotate(2deg) translateZ(32px); z-index: 7; }

    /* =========================
       CAJA 3D
       ========================= */

    .gift {
      position: absolute;
      left: 50%;
      bottom: 9%;
      width: 280px;
      height: 260px;
      transform: translateX(-50%);
      transform-style: preserve-3d;
      z-index: 20;
      cursor: pointer;
      outline: none;
    }

    .gift:focus-visible {
      filter: drop-shadow(0 0 0.6rem rgba(255, 194, 0, .65));
    }

    .box {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 240px;
      height: 175px;
      transform: translateX(-50%);
      border-radius: 4px 4px 12px 12px;
      background:
        linear-gradient(90deg,
          rgba(89,51,5,.12),
          transparent 18% 82%,
          rgba(89,51,5,.16)
        ),
        repeating-linear-gradient(
          115deg,
          rgba(255,255,255,.055) 0 1px,
          transparent 1px 7px
        ),
        linear-gradient(145deg, var(--box1), var(--box2) 58%, var(--box3));
      box-shadow:
        inset 7px 0 12px rgba(255,255,255,.16),
        inset -10px -8px 14px rgba(79,45,4,.18),
        0 22px 28px rgba(86,52,15,.24);
      overflow: hidden;
    }

    .box::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 48px;
      height: 100%;
      transform: translateX(-50%);
      background:
        linear-gradient(90deg,
          var(--ribbon3),
          var(--ribbon1) 28%,
          var(--ribbon2) 54%,
          var(--ribbon3)
        );
      box-shadow:
        inset 5px 0 7px rgba(255,255,255,.18),
        inset -5px 0 7px rgba(79,45,4,.16);
    }

    .box::after {
      content: "";
      position: absolute;
      left: 0;
      top: 44%;
      width: 100%;
      height: 39px;
      background:
        linear-gradient(
          180deg,
          var(--ribbon3),
          var(--ribbon1) 26%,
          var(--ribbon2) 60%,
          var(--ribbon3)
        );
      box-shadow:
        inset 0 4px 6px rgba(255,255,255,.15),
        inset 0 -4px 7px rgba(79,45,4,.14);
    }

    .lid {
      position: absolute;
      left: 50%;
      bottom: 159px;
      width: 270px;
      height: 63px;
      transform-origin: 20% 85%;
      transform: translateX(-50%) translateZ(18px);
      border-radius: 9px;
      z-index: 5;
      transition:
        transform 1.05s cubic-bezier(.22,.8,.25,1.05),
        filter .7s ease;
      background:
        linear-gradient(90deg,
          rgba(86,48,2,.11),
          transparent 18% 82%,
          rgba(86,48,2,.16)
        ),
        repeating-linear-gradient(
          112deg,
          rgba(255,255,255,.055) 0 1px,
          transparent 1px 7px
        ),
        linear-gradient(145deg, #ffd968, #e2a42f 60%, #ab6c15);
      box-shadow:
        inset 6px 7px 10px rgba(255,255,255,.2),
        inset -8px -8px 11px rgba(80,45,4,.17),
        0 12px 14px rgba(76,45,12,.22);
    }

    .lid::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 54px;
      height: 100%;
      transform: translateX(-50%);
      background:
        linear-gradient(90deg,
          var(--ribbon3),
          var(--ribbon1) 28%,
          var(--ribbon2) 56%,
          var(--ribbon3)
        );
    }

    .lid::after {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 18px;
      transform: translateY(-50%);
      background:
        linear-gradient(
          180deg,
          var(--ribbon3),
          var(--ribbon1) 28%,
          var(--ribbon2) 58%,
          var(--ribbon3)
        );
    }

    .bow {
      position: absolute;
      left: 50%;
      bottom: 210px;
      width: 120px;
      height: 72px;
      transform: translateX(-50%) translateZ(30px);
      z-index: 7;
      transition: transform 1.05s cubic-bezier(.22,.8,.25,1.05);
    }

    .bow::before,
    .bow::after {
      content: "";
      position: absolute;
      top: 13px;
      width: 62px;
      height: 45px;
      border-radius: 52% 48% 56% 44%;
      background:
        radial-gradient(circle at 34% 28%, rgba(255,255,255,.35), transparent 24%),
        linear-gradient(145deg, var(--ribbon1), var(--ribbon2) 58%, var(--ribbon3));
      box-shadow:
        inset -7px -7px 10px rgba(83,50,5,.15),
        0 6px 8px rgba(88,55,12,.16);
    }

    .bow::before {
      left: 4px;
      transform: rotate(22deg);
      transform-origin: right center;
    }

    .bow::after {
      right: 4px;
      transform: rotate(-22deg);
      transform-origin: left center;
    }

    .knot {
      position: absolute;
      left: 50%;
      top: 19px;
      width: 36px;
      height: 36px;
      transform: translateX(-50%);
      border-radius: 50%;
      z-index: 3;
      background:
        radial-gradient(circle at 35% 30%, #fff2ae, #d1a12d 55%, #9a6911);
      box-shadow:
        inset -5px -6px 8px rgba(76,43,3,.18),
        0 4px 6px rgba(68,40,8,.18);
    }

    .gift:hover .lid,
    .gift:hover .bow {
      filter: brightness(1.035);
    }

    .gift:hover {
      animation: tiny-bounce .75s ease-in-out infinite alternate;
    }

    @keyframes tiny-bounce {
      from { transform: translateX(-50%) translateY(0); }
      to   { transform: translateX(-50%) translateY(-4px); }
    }

    .scene.open .gift {
      animation: none;
      cursor: default;
    }

    .scene.open .lid {
      transform:
        translateX(-50%)
        translate(-105px, -62px)
        rotateZ(-18deg)
        rotateY(-24deg)
        rotateX(16deg)
        translateZ(36px);
    }

    .scene.open .bow {
      transform:
        translateX(-50%)
        translate(-104px, -65px)
        rotateZ(-18deg)
        rotateY(-24deg)
        rotateX(16deg)
        translateZ(48px);
    }

    /* brillo al abrir */
    .glow {
      position: absolute;
      left: 50%;
      bottom: 155px;
      width: 240px;
      height: 170px;
      transform: translateX(-50%) scale(.35);
      border-radius: 50%;
      opacity: 0;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(circle,
          rgba(255,241,135,.7),
          rgba(255,211,56,.28) 38%,
          transparent 72%);
      filter: blur(5px);
      transition:
        opacity .8s ease .15s,
        transform 1s ease .15s;
    }

    .scene.open .glow {
      opacity: 1;
      transform: translateX(-50%) scale(1.35);
    }

    /* pequeñas partículas */
    .spark {
      position: absolute;
      left: 50%;
      bottom: 210px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      opacity: 0;
      z-index: 12;
      pointer-events: none;
      background: #ffd438;
      box-shadow: 0 0 11px #ffe978;
    }

    .scene.open .spark {
      animation: sparkle 1.8s ease-out forwards;
    }

    .sp1 { --x: -150px; --y: -200px; animation-delay: .28s !important; }
    .sp2 { --x: -95px;  --y: -275px; animation-delay: .40s !important; }
    .sp3 { --x: -35px;  --y: -320px; animation-delay: .22s !important; }
    .sp4 { --x: 45px;   --y: -300px; animation-delay: .34s !important; }
    .sp5 { --x: 110px;  --y: -245px; animation-delay: .48s !important; }
    .sp6 { --x: 155px;  --y: -175px; animation-delay: .30s !important; }

    @keyframes sparkle {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) scale(.2);
      }
      22% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), var(--y)) scale(1.4);
      }
    }

    @media (max-width: 620px) {
      .scene {
        transform: scale(.88);
      }
    }

    @media (max-height: 720px) {
      .scene {
        transform: scale(.8);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gift,
      .lid,
      .bow,
      .bouquet,
      .spark,
      .glow {
        animation: none !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="scene" id="scene">

    <div class="floor-shadow"></div>

    <div class="glow"></div>

    <span class="spark sp1"></span>
    <span class="spark sp2"></span>
    <span class="spark sp3"></span>
    <span class="spark sp4"></span>
    <span class="spark sp5"></span>
    <span class="spark sp6"></span>

    <section class="bouquet" aria-hidden="true">
      <div class="stem s1"></div>
      <div class="stem s2"></div>
      <div class="stem s3"></div>
      <div class="stem s4"></div>
      <div class="stem s5"></div>
      <div class="stem s6"></div>
      <div class="stem s7"></div>
      <div class="stem s8"></div>
      <div class="stem s9"></div>

      <div class="leaf l1"></div>
      <div class="leaf l2"></div>
      <div class="leaf l3"></div>
      <div class="leaf l4"></div>
      <div class="leaf l5"></div>
      <div class="leaf l6"></div>

      <div class="flower f1">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <div class="flower f2">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <div class="flower f3">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <div class="flower f4">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <div class="flower f5">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <div class="flower f6">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <div class="flower f7">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <div class="flower f8">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>

      <div class="flower f9">
        <span class="petal p1"></span><span class="petal p2"></span>
        <span class="petal p3"></span><span class="petal p4"></span>
        <span class="petal p5"></span><span class="petal p6"></span>
        <span class="petal p7"></span><span class="petal p8"></span>
        <span class="center"></span>
      </div>
    </section>

    <div
      class="gift"
      id="gift"
      role="button"
      tabindex="0"
      aria-label="Abrir regalo"
      aria-expanded="false"
    >
      <div class="lid"></div>

      <div class="bow">
        <div class="knot"></div>
      </div>

      <div class="box"></div>
    </div>

  </main>

  <script>
    const scene = document.getElementById("scene");
    const gift = document.getElementById("gift");

    function openGift() {
      if (scene.classList.contains("open")) return;

      scene.classList.add("open");
      gift.setAttribute("aria-expanded", "true");
    }

    gift.addEventListener("click", openGift);

    gift.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openGift();
      }
    });
  </script>
</body>
</html>
